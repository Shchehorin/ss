<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeppelin Crash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">ZEPPELIN<span>CRASH</span><i class="demo">DEMO</i></div>
    <div class="balance">Баланс <b id="balance">1000.00</b></div>
  </header>

  <main class="layout">
    <aside class="feed">
      <div class="feed-head"><span>Ставки гравців</span><b id="feed-count">0</b></div>
      <div class="feed-stats">
        <div><small>Загальна ставка</small><b id="feed-total">0</b></div>
        <div><small>Виплачено</small><b id="feed-paid" class="pos">0</b></div>
      </div>
      <div class="feed-cols"><span>Гравець</span><span>Ставка</span><span>x</span><span>Виграш</span></div>
      <ul id="feed-list"></ul>
    </aside>

    <section class="stage">
      <div class="history" id="history"></div>
      <canvas id="canvas"></canvas>
      <div class="multiplier" id="multiplier">1.00x</div>
      <div class="status" id="status">Очікування…</div>
    </section>

    <aside class="panel">
      <div class="stepper">
        <button class="step chip-add" data-add="-10" aria-label="Менше">−</button>
        <div class="amount">
          <small>Ставка</small>
          <input id="bet" type="number" min="1" step="1" value="10">
        </div>
        <button class="step chip-add" data-add="10" aria-label="Більше">+</button>
      </div>
      <div class="quick">
        <button class="chip" data-mul="0.5">½</button>
        <button class="chip" data-set="50">50</button>
        <button class="chip" data-set="100">100</button>
        <button class="chip" data-set="500">500</button>
        <button class="chip" data-mul="2">2×</button>
      </div>
      <div class="autobox">
        <label><input type="checkbox" id="auto-on"> Автовивід</label>
        <span class="autoval"><input id="auto" type="number" min="1.01" step="0.01" value="2.00" disabled>x</span>
      </div>
      <button id="action" class="action">Зробити ставку</button>
    </aside>
  </main>

  <script src="game.js"></script>
</body>
</html>
