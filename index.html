<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цілодобовий Шиномонтаж Рівне</title>
    <!-- Підключення Tailwind CSS для швидкого та адаптивного дизайну -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Підключення шрифту Inter з Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Підключення вашого кастомного CSS файлу -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Додаткові стилі для шрифту Inter */
        body {
            font-family: 'Inter', sans-serif;
            /* Додаємо відступ зверху для фіксованої шапки, щоб контент не ховався під нею */
            padding-top: 5rem; /* Приблизно 80px, щоб врахувати висоту шапки та її тінь */
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <!-- Контейнер для фіксованої шапки (Fixed Header Container) -->
    <!-- Цей div робить шапку фіксованою на всю ширину екрану та центрує її вміст -->
    <div class="fixed top-0 left-0 w-full z-50 flex justify-center">
        <!-- Шапка сайту (Header) - ОНОВЛЕНО З ЕФЕКТОМ СКЛА -->
        <!-- bg-gray-800/30 - напівпрозорий фон, backdrop-blur-lg - ефект розмиття (скла) -->
        <!-- border border-gray-700/50 - тонка рамка для підкреслення ефекту скла -->
        <!-- py-2 px-4 - вертикальні та горизонтальні відступи, shadow-lg - тінь -->
        <!-- rounded-b-xl - заокруглення нижніх кутів, w-[95%] max-w-7xl - ширина та центрування -->
        <header class="bg-gray-800/30 backdrop-blur-lg border border-gray-700/50 py-2 px-4 shadow-lg rounded-b-xl w-[95%] max-w-7xl">
            <!-- Навігація всередині шапки: елементи вирівняні по краях та по центру вертикально -->
            <nav class="flex justify-between items-center h-full">
                <!-- Назва сайту в боксі "Шиномонтаж 24/7" -->
                <!-- bg-blue-600/20 - напівпрозорий синій фон, text-blue-300 - синій текст -->
                <!-- px-3 py-1 - відступи всередині боксу, rounded-lg - заокруглені кути -->
                <!-- font-semibold text-sm - напівжирний та маленький шрифт, whitespace-nowrap - щоб текст не переносився -->
                <div class="bg-blue-600/20 text-blue-300 px-3 py-1 rounded-lg font-semibold text-sm whitespace-nowrap">
                    Шиномонтаж 24/7
                </div>
                <!-- Іконки з правої сторони -->
                <div class="flex items-center gap-4">
                    <!-- Іконка телефону -->
                    <!-- p-1 - мінімальний відступ, rounded-full - кругла форма -->
                    <!-- bg-gray-700/50 - напівпрозорий сірий фон для іконки, hover-ефекти для інтерактивності -->
                    <a href="tel:+380XXXXXXXXX" class="p-1 rounded-full bg-gray-700/50 hover:bg-blue-600/50 transition-colors duration-300 flex items-center justify-center">
                        <svg class="w-4 h-4 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                        </svg>
                    </a>
                    <!-- Іконка запису на прийом (використовуємо іконку календаря) -->
                    <a href="#" class="p-1 rounded-full bg-gray-700/50 hover:bg-blue-600/50 transition-colors duration-300 flex items-center justify-center">
                        <svg class="w-4 h-4 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h.01M7 11h.01M11 11h.01M13 11h.01M17 11h.01M7 15h.01M11 15h.01M13 15h.01M17 15h.01M4 17H3a2 2 0 01-2-2V7a2 2 0 012-2h18a2 2 0 012 2v10a2 2 0 01-2 2h-1M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2zM12 15v-6m-3 3h6"></path>
                        </svg>
                    </a>
                </div>
            </nav>
        </header>
    </div>

    <!-- Основний контент (Main Content) -->
    <!-- Зверніть увагу, що mt-8 тут видалено, оскільки padding-top на body вже забезпечує відступ -->
    <main class="flex-grow container mx-auto p-4 sm:p-6 lg:p-8">
        <section class="text-center bg-gray-800 p-8 rounded-2xl shadow-xl">
            <h1 class="text-4xl sm:text-5xl font-extrabold text-blue-400 mb-4">
                Цілодобовий Шиномонтаж у Рівному
            </h1>
            <p class="text-lg sm:text-xl text-gray-300 mb-8">
                Швидко, якісно, 24/7. Ваша безпека на дорозі — наш пріоритет.
            </p>
            <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all duration-300 transform hover:scale-105">
                <a href="tel:+380XXXXXXXXX" class="block">Зателефонувати зараз</a>
            </button>
        </section>

        <!-- Тут будуть додаватися інші секції: послуги, відгуки, карта тощо -->

    </main>

    <!-- Футер сайту (Footer) -->
    <footer class="bg-gray-800 p-6 text-center text-gray-400 mt-8 rounded-t-xl mx-auto mb-4 w-[95%] max-w-7xl">
        <p>&copy; 2025 Цілодобовий Шиномонтаж Рівне. Всі права захищені.</p>
        <div class="flex justify-center gap-4 mt-3">
            <a href="#" class="hover:text-blue-400 transition-colors duration-300">Політика конфіденційності</a>
            <span class="text-gray-600">|</span>
            <a href="#" class="hover:text-blue-400 transition-colors duration-300">Умови використання</a>
        </div>
    </footer>

</body>
</html>
