<!-- Pop-up Modal for Phone Options -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const phoneIconLink = document.getElementById('phoneIconLink');
            const phoneModal = document.getElementById('phoneModal');
            const closeModalButton = document.getElementById('closeModal');

            // Функція для показу модального вікна
            function showModal() {
                phoneModal.classList.remove('hidden');
                // Затримка для плавного переходу (opacity та scale)
                setTimeout(() => {
                    phoneModal.classList.add('opacity-100');
                    phoneModal.querySelector('div').classList.remove('scale-95');
                    phoneModal.querySelector('div').classList.add('scale-100');
                }, 10);
            }

            // Функція для приховування модального вікна
            function hideModal() {
                phoneModal.classList.remove('opacity-100');
                phoneModal.querySelector('div').classList.remove('scale-100');
                phoneModal.querySelector('div').classList.add('scale-95');
                setTimeout(() => {
                    phoneModal.classList.add('hidden');
                }, 300); // Час для transition
            }

            if (phoneIconLink) {
                phoneIconLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    showModal();
                });
            }

            if (closeModalButton) {
                closeModalButton.addEventListener('click', hideModal);
            }

            //   У цьому випадку можна розглянути посилання на веб-версію Viber або інструкцію.
        });
</script>
