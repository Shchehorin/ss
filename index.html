<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цілодобовий Шиномонтаж Рівне</title>
    <!-- Підключення Tailwind CSS для швидкого та адаптивного дизайну -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Підключення шрифту Inter з Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Підключення вашого кастомного CSS файлу -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Додаткові стилі для шрифту Inter */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <!-- Шапка сайту (Header) -->
    <header class="bg-gray-800 p-4 shadow-lg rounded-b-xl mx-auto mt-4 w-[95%] max-w-7xl">
        <nav class="flex flex-col sm:flex-row justify-between items-center">
            <div class="text-2xl font-bold text-gray-50 mb-4 sm:mb-0">
                <a href="#" class="hover:text-blue-400 transition-colors duration-300">Шиномонтаж Рівне</a>
            </div>
            <ul class="flex flex-wrap justify-center gap-4 sm:gap-6">
                <li><a href="#" class="text-gray-300 hover:text-blue-400 transition-colors duration-300 px-3 py-2 rounded-lg">Головна</a></li>
                <li><a href="#" class="text-gray-300 hover:text-blue-400 transition-colors duration-300 px-3 py-2 rounded-lg">Послуги</a></li>
                <li><a href="#" class="text-gray-300 hover:text-blue-400 transition-colors duration-300 px-3 py-2 rounded-lg">Про нас</a></li>
                <li><a href="#" class="text-gray-300 hover:text-blue-400 transition-colors duration-300 px-3 py-2 rounded-lg">Контакти</a></li>
            </ul>
        </nav>
    </header>

    <!-- Основний контент (Main Content) -->
    <main class="flex-grow container mx-auto p-4 sm:p-6 lg:p-8 mt-8">
        <section class="text-center bg-gray-800 p-8 rounded-2xl shadow-xl">
            <h1 class="text-4xl sm:text-5xl font-extrabold text-blue-400 mb-4">
                Цілодобовий Шиномонтаж у Рівному
            </h1>
            <p class="text-lg sm:text-xl text-gray-300 mb-8">
                Швидко, якісно, 24/7. Ваша безпека на дорозі — наш пріоритет.
            </p>
            <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all duration-300 transform hover:scale-105">
                <a href="tel:+380XXXXXXXXX" class="block">Зателефонувати зараз</a>
            </button>
        </section>

        <!-- Тут будуть додаватися інші секції: послуги, відгуки, карта тощо -->

    </main>

    <!-- Футер сайту (Footer) -->
    <footer class="bg-gray-800 p-6 text-center text-gray-400 mt-8 rounded-t-xl mx-auto mb-4 w-[95%] max-w-7xl">
        <p>&copy; 2025 Цілодобовий Шиномонтаж Рівне. Всі права захищені.</p>
        <div class="flex justify-center gap-4 mt-3">
            <a href="#" class="hover:text-blue-400 transition-colors duration-300">Політика конфіденційності</a>
            <span class="text-gray-600">|</span>
            <a href="#" class="hover:text-blue-400 transition-colors duration-300">Умови використання</a>
        </div>
    </footer>

</body>
</html>
